name: Course quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-course:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements/*.txt'
      - name: Install pinned CPU environment
        run: |
          python -m pip install -r requirements/cpu.txt
          python -m pip check
          python -m ipykernel install --user --name course-ci
          mkdir -p artifacts
          python -m pip freeze > artifacts/environment.txt
      - name: Validate structure, syntax, links and tracks
        run: python tools/validate_course.py
      - name: Reference implementations and engineering tests
        run: python -m pytest --junitxml=artifacts/tests.xml -q
      - name: Fresh-kernel execution of every worked notebook
        run: python tools/execute_notebooks.py --group all --workers 2 --timeout 180 --kernel course-ci
      - name: Prepare a trained artifact for real container testing
        run: python -m capstones.rf_detection.train --seeds 0 --n-train 300 --n-eval 200 --output artifacts/container-model
      - name: Build and run the unprivileged inference container
        run: |
          docker build -f capstones/rf_detection/Dockerfile -t course-rf:ci .
          docker run -d --name course-rf-ci --read-only --tmpfs /tmp -p 127.0.0.1:8000:8000 -v "$PWD/artifacts/container-model/model.json:/models/model.json:ro" course-rf:ci
          python tools/check_container_parity.py --artifact artifacts/container-model/model.json --request artifacts/container-model/sample_request.json
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs course-rf-ci > artifacts/container.log 2>&1 || true
          docker rm -f course-rf-ci || true
      - name: Preserve execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-quality-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
