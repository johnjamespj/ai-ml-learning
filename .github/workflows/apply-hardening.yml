name: Apply verified course hardening
on:
  push:
    branches: ['course-hardening/2026-09-22']
    paths: ['.github/workflows/apply-hardening.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'johnjamespj/ai-ml-learning'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: course-hardening/2026-09-22
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat==5.10.4
      - name: Reconstruct and verify locally tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, sys, urllib.request
          from pathlib import Path
          root = Path.cwd().resolve()
          shas = ['3cd80f248edaa6a690f514dfce929776654a423c', '9d03f7ef291307d47e920b4291dd33f084b14c9a', 'b4ecf0ace012981ecea3caa80e30a75f482fec2d', '037a70c928d16dbbf5aa518a349e7dcf1fc77afb', 'e741dc680acdd92736f4f84103262322623388aa']
          chunks = []
          for sha in shas:
              url = 'https://api.github.com/repos/johnjamespj/ai-ml-learning/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'course-hardening'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              chunks.append(base64.b64decode(blob['content']))
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == 'fb2ed4bcfede2a7c74b97eae0efbe639db275dab7d150d356bca888dd3e894d6', 'Payload hash mismatch'
          payload = json.loads(lzma.decompress(packed))
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == payload['base'], 'Base changed; manual reconciliation required'
          def safe_path(name):
              path = (root / name).resolve()
              if root not in path.parents or '.git' in path.parts or '.github' in path.parts:
                  raise ValueError('Disallowed payload path: ' + name)
              return path
          for name, text in payload['files'].items():
              path = safe_path(name)
              if text is None:
                  path.unlink(missing_ok=True)
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
          for script in ('repair_notebooks.py', 'refine_paper_methods.py', 'build_assessments.py', 'build_math_problem_sets.py'):
              subprocess.run([sys.executable, 'tools/' + script], check=True)
          for name, ids in payload['notebook_ids'].items():
              path = safe_path(name)
              notebook = json.loads(path.read_text())
              for index, cell_id in ids.items():
                  notebook['cells'][int(index)]['id'] = cell_id
              path.write_text(json.dumps(notebook, indent=1, ensure_ascii=False, sort_keys=True) + '\n')
          records = {name: hashlib.sha256(safe_path(name).read_bytes()).hexdigest() if safe_path(name).exists() else None for name in payload['paths']}
          digest = hashlib.sha256(json.dumps(records, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert digest == payload['expected_manifest_digest'], 'Output manifest mismatch: ' + digest
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert not any(name.startswith('.github/') for name in changed), 'Workflow changes must use connector review'
          subprocess.run(['git', 'add', '-A', '--', *payload['paths']], check=True)
          print('Verified locally tested content manifest:', digest)
          print('Staged changed paths:', len(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()))
          PY
      - name: Commit reviewable changes to the authorized branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden notebooks, assessments, reproducibility and RF capstone'
          git push origin HEAD:course-hardening/2026-09-22
