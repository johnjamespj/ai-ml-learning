[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-learning-coursekit"
version = "0.1.0"
description = "Notebook execution, evidence recording, and educational RF detection"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["coursekit*", "capstones*"]
